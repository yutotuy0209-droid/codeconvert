name: tests

on:
  push:
    paths:
      - "src/**"
      - "tests/**"
      - "*.bat"
      - ".github/workflows/tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "*.bat"
      - ".github/workflows/tests.yml"

jobs:
  unittest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile source
        run: python -m compileall src tests
      - name: Run tests
        run: python -m unittest discover -s tests -p "test_*.py"
